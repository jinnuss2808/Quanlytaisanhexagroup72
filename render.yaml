# HEXA API — Render Free. Deploy Blueprint from your private GitHub repository.
# IMPORTANT: Firebase credentials are entered as secret environment variables.
services:
  - type: web
    name: hexa-ticket-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: '22'
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: REMINDER_SWEEP_MS
        value: '30000'
